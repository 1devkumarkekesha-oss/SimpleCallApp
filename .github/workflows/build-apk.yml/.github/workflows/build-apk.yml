name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk SimpleCallApp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCallApp-debug-apk
          path: SimpleCallApp.apk

      - name: Publish APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-build${{ github.run_number }}
          name: Simple Call v2.0 (build ${{ github.run_number }})
          body: |
            Simple Call — Contacts + Dialer + Call History + custom incoming-call screen.
            Download SimpleCallApp.apk below and install it on Android 8.0+.
            On first open, allow Contacts / Phone / Call Log / Notifications permissions.
            Note: if the AndroidIDE-built version is already installed, uninstall it first — this APK is signed with a different (GitHub) debug key.
          files: SimpleCallApp.apk
          make_latest: true
          
